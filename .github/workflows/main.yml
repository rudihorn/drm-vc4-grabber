name: Release
on:
  pull_request:
    branches:
      - master
  push:
    tags:
    - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  BIN_NAME: drm-vc4-grabber
  PROJECT_NAME: drm-vc4-grabber
  REPO_NAME: rudihorn/drm-vc4-grabber

jobs:
  dist:
    name: Dist
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        build: [aarch64-linux]
        include:
        - build: aarch64-linux
          os: ubuntu-24.04
          rust: stable
          target: aarch64-unknown-linux-musl
          cross: true

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install ${{ matrix.rust }} toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ matrix.rust }}
          target: ${{ matrix.target }}
          override: true

      - name: Run cargo test
        uses: actions-rs/cargo@v1
        with:
          use-cross: ${{ matrix.cross }}
          command: test
          args: --release --locked --target ${{ matrix.target }}

      - name: Build release binary
        uses: actions-rs/cargo@v1
        with:
          use-cross: ${{ matrix.cross }}
          command: build
          args: --release --locked --target ${{ matrix.target }}

      - name: Stage build outputs
        shell: bash
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/$BIN_NAME" dist/

      - uses: actions/upload-artifact@v4
        with:
          name: bins-${{ matrix.build }}
          path: dist

  publish:
    name: Publish
    needs: [dist]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/download-artifact@v4

      - name: Calculate tag name
        id: tagname
        run: |
          name=dev
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            name=${GITHUB_REF:10}
          fi
          echo "val=$name" >> "$GITHUB_OUTPUT"
          echo "TAG=$name" >> "$GITHUB_ENV"

      - name: Assemble release archives
        shell: bash
        run: |
          set -ex

          rm -rf tmp dist
          mkdir tmp dist

          for dir in bins-*; do
              platform=${dir#"bins-"}
              pkgname="$PROJECT_NAME-$TAG-$platform"
              mkdir "tmp/$pkgname"

              # Binary
              mv "bins-$platform/$BIN_NAME" "tmp/$pkgname/"
              chmod +x "tmp/$pkgname/$BIN_NAME"

              # Bundled helpers so users can install without cloning the repo
              cp LICENSE README.md "tmp/$pkgname/"
              cp systemd/drm-capture.service "tmp/$pkgname/"

              tar cJf "dist/$pkgname.tar.xz" -C tmp "$pkgname"
          done

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/*
          file_glob: true
          tag: ${{ steps.tagname.outputs.val }}
          overwrite: true
